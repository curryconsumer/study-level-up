```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Level Up</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #171717;
}

.app {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 20px 50px;
}

h1 {
    margin: 0 0 6px;
    font-size: 32px;
}

.subtitle {
    color: #666;
    margin-bottom: 28px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.level-row {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 12px;
}

.level {
    font-size: 28px;
    font-weight: bold;
}

.xp-text {
    color: #555;
}


/* XP PROGRESS BAR */

.bar {
    width: 100%;
    height: 18px;
    background: #e5e7eb;
    border-radius: 99px;
    overflow: hidden;
    display: flex;
}

.xp-segment {
    height: 100%;
    transition: width .25s ease;
}


/* TASK */

.task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.task h2 {
    margin: 0 0 6px;
    font-size: 21px;
}

.task p {
    margin: 0;
    color: #666;
}


/* BUTTONS */

button {
    border: 0;
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #171717;
    color: white;
}

button:hover {
    opacity: .85;
}


/* INPUTS */

select,
input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}


/* RESET */

.reset {
    margin-top: 8px;
}

.reset button {
    background: #8b0000;
}

.small {
    color: #777;
    font-size: 13px;
    margin-top: 12px;
}


/* MOBILE */

@media(max-width:600px) {

    .task {
        align-items: stretch;
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>
</head>


<body>

<div class="app">

<h1>Study Level Up</h1>

<div class="subtitle">
Study, earn XP, level up.
</div>


<!-- LEVEL -->

<div class="card">

    <div class="level-row">

        <div class="level" id="level">
            Level 1
        </div>

        <div class="xp-text" id="xpText">
            0 / 100 XP
        </div>

    </div>


    <!-- COLOURED XP BAR -->

    <div class="bar" id="mainBar"></div>


    <div class="small" id="totalXp">
        Total XP: 0
    </div>

</div>


<!-- SUBJECT -->

<div class="card">

    <h2>Subject</h2>

    <select id="subjectSelect"></select>

</div>


<!-- COMPLETE TASK -->

<div class="card">

    <div class="task">

        <div>

            <h2>
                Complete a study task
            </h2>

            <p>
                Complete one task in your selected subject.
            </p>

        </div>

        <button onclick="completeTask()">
            Complete Task (+25 XP)
        </button>

    </div>

</div>


<!-- RESET -->

<div class="card">

    <h2>
        Reset Progress
    </h2>

    <p class="small">
        This permanently resets all XP and levels.
        Type the exact phrase to reset:
        'BAGUETTES ARE HOLY'.
    </p>

    <input
        id="resetPhrase"
        placeholder="Type the reset phrase"
    >

    <div class="reset">

        <button
            onclick="resetProgress()"
            id="resetButton"
            disabled
        >
            Reset Progress
        </button>

    </div>

</div>

</div>


<script>


/* SUBJECTS */

const subjects = [

    "Art",
    "Biology",
    "Chemistry",
    "Computer Science",
    "English Language",
    "English Literature",
    "French",
    "Geography",
    "History",
    "Mathematics",
    "Religious Studies",
    "Physics"

];


const TASK_XP = 25;

const RESET_PHRASE = "BAGUETTES ARE HOLY";


/* SUBJECT COLOURS */

const subjectColours = {

    "Art": "#e53935",

    "Biology": "#40e0d0",

    "Chemistry": "#ffd600",

    "Computer Science": "#87ceeb",

    "English Language": "#00008b",

    "English Literature": "#8b4513",

    "French": "#ff69b4",

    "Geography": "#006400",

    "History": "#ff8c00",

    "Mathematics": "#d4af37",

    "Religious Studies": "#c0c0c0",

    "Physics": "#228b22"

};


/*
LEVEL SYSTEM

Level 1 = 100 XP
Level 2 = 105 XP
Level 3 = 110 XP
Level 4 = 115 XP
etc.
*/


function xpForLevel(level) {

    return 100 + (level - 1) * 5;

}


/* WORK OUT CURRENT LEVEL */

function getLevel(totalXp) {

    let level = 1;

    let remaining = totalXp;

    while (remaining >= xpForLevel(level)) {

        remaining -= xpForLevel(level);

        level++;

    }

    return {

        level: level,

        current: remaining,

        needed: xpForLevel(level)

    };

}


/* LOAD SAVED DATA */

let data;

try {

    data = JSON.parse(
        localStorage.getItem("studyLevelUp")
    );

} catch (e) {

    data = null;

}


/*
CREATE NEW DATA IF THERE IS NONE
*/

if (
    !data ||
    typeof data.totalXp !== "number"
) {

    data = {

        totalXp: 0,

        subjects: {},

        history: []

    };

}


/*
MAKE SURE ALL SUBJECTS EXIST
*/

if (!data.subjects) {

    data.subjects = {};

}

subjects.forEach(subject => {

    if (
        typeof data.subjects[subject] !== "number"
    ) {

        data.subjects[subject] = 0;

    }

});


/*
HISTORY WAS NOT IN THE OLD VERSION.

If the user already had progress,
keep it safe.
*/

if (!Array.isArray(data.history)) {

    data.history = [];

}


/* SAVE */

function save() {

    localStorage.setItem(
        "studyLevelUp",
        JSON.stringify(data)
    );

}


/* COMPLETE TASK */

function completeTask() {

    const subject =
        document.getElementById("subjectSelect").value;


    /* Add XP */

    data.totalXp += TASK_XP;

    data.subjects[subject] += TASK_XP;


    /*
    Remember exactly which subject
    the XP came from.
    */

    data.history.push({

        subject: subject,

        xp: TASK_XP

    });


    save();

    render();

}


/* RESET */

function resetProgress() {

    if (
        document.getElementById("resetPhrase").value
        === RESET_PHRASE
    ) {

        data = {

            totalXp: 0,

            subjects: {},

            history: []

        };


        subjects.forEach(subject => {

            data.subjects[subject] = 0;

        });


        save();


        document.getElementById(
            "resetPhrase"
        ).value = "";


        document.getElementById(
            "resetButton"
        ).disabled = true;


        render();

    }

}


/*
CREATE THE COLOURED PROGRESS BAR
*/

function renderProgressBar() {

    const bar =
        document.getElementById("mainBar");


    /* Remove old segments */

    bar.innerHTML = "";


    const overall =
        getLevel(data.totalXp);


    /*
    Find how much total XP has already
    been used by previous levels.
    */

    let xpBeforeCurrentLevel = 0;

    for (
        let level = 1;
        level < overall.level;
        level++
    ) {

        xpBeforeCurrentLevel +=
            xpForLevel(level);

    }


    /*
    XP position where the current level starts
    */

    let xpPosition = 0;


    /*
    Go through every completed task
    in the order it happened.
    */

    data.history.forEach(task => {


        const taskStart =
            xpPosition;


        const taskEnd =
            xpPosition + task.xp;


        xpPosition = taskEnd;


        /*
        Ignore tasks completely before
        the current level.
        */

        if (
            taskEnd <= xpBeforeCurrentLevel
        ) {

            return;

        }


        /*
        Work out how much of this task
        belongs to the current level.
        */

        const visibleStart =
            Math.max(
                taskStart,
                xpBeforeCurrentLevel
            );


        const visibleEnd =
            Math.min(
                taskEnd,
                xpBeforeCurrentLevel
                + overall.needed
            );


        const visibleXp =
            visibleEnd - visibleStart;


        if (visibleXp <= 0) {

            return;

        }


        /*
        Create coloured section
        */

        const segment =
            document.createElement("div");


        segment.className =
            "xp-segment";


        segment.style.width =
            (
                visibleXp /
                overall.needed *
                100
            ) + "%";


        segment.style.backgroundColor =
            subjectColours[task.subject];


        bar.appendChild(segment);

    });


    /*
    If the user has old XP that wasn't recorded
    in the history system, show it as black
    rather than losing it.
    */

    const historyXp =
        data.history.reduce(
            (total, task) => total + task.xp,
            0
        );


    const oldXp =
        data.totalXp - historyXp;


    if (
        oldXp > 0 &&
        overall.level === 1
    ) {

        const segment =
            document.createElement("div");


        segment.className =
            "xp-segment";


        segment.style.width =
            (
                Math.min(
                    oldXp,
                    overall.needed
                ) /
                overall.needed *
                100
            ) + "%";


        segment.style.backgroundColor =
            "#171717";


        bar.insertBefore(
            segment,
            bar.firstChild
        );

    }

}


/* RENDER EVERYTHING */

function render() {

    const overall =
        getLevel(data.totalXp);


    document.getElementById(
        "level"
    ).textContent =
        "Level " + overall.level;


    document.getElementById(
        "xpText"
    ).textContent =
        overall.current +
        " / " +
        overall.needed +
        " XP";


    document.getElementById(
        "totalXp"
    ).textContent =
        "Total XP: " +
        data.totalXp;


    renderProgressBar();

}


/* CREATE SUBJECT DROPDOWN */

const select =
    document.getElementById(
        "subjectSelect"
    );


subjects.forEach(subject => {

    const option =
        document.createElement(
            "option"
        );

    option.value = subject;

    option.textContent = subject;

    select.appendChild(option);

});


/* RESET BUTTON */

document
    .getElementById("resetPhrase")
    .addEventListener(
        "input",
        function() {

            document.getElementById(
                "resetButton"
            ).disabled =
                this.value !== RESET_PHRASE;

        }
    );


/* START */

render();

</script>

</body>
</html>
