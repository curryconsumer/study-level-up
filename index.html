```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Level Up</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #171717;
}

.app {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 20px 50px;
}

h1 {
    margin: 0 0 6px;
    font-size: 32px;
}

.subtitle {
    color: #666;
    margin-bottom: 28px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.level-row {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 12px;
}

.level {
    font-size: 28px;
    font-weight: bold;
}

.xp-text {
    color: #555;
}

/* PROGRESS BAR */

.bar {
    width: 100%;
    height: 18px;
    background: #e5e7eb;
    border-radius: 99px;
    overflow: hidden;
    display: flex;
}

.xp-segment {
    height: 100%;
    flex-shrink: 0;
}

/* TASK */

.task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.task h2 {
    margin: 0 0 6px;
    font-size: 21px;
}

.task p {
    margin: 0;
    color: #666;
}

/* BUTTONS */

button {
    border: 0;
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #171717;
    color: white;
}

button:hover {
    opacity: .85;
}

/* INPUTS */

select,
input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

/* RESET */

.reset {
    margin-top: 8px;
}

.reset button {
    background: #8b0000;
}

.small {
    color: #777;
    font-size: 13px;
    margin-top: 12px;
}

/* MOBILE */

@media(max-width:600px) {
    .task {
        align-items: stretch;
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

<h1>Study Level Up</h1>

<div class="subtitle">
Study, earn XP, level up.
</div>


<!-- LEVEL -->

<div class="card">

    <div class="level-row">

        <div class="level" id="level">
            Level 1
        </div>

        <div class="xp-text" id="xpText">
            0 / 100 XP
        </div>

    </div>

    <div class="bar" id="mainBar"></div>

    <div class="small" id="totalXp">
        Total XP: 0
    </div>

</div>


<!-- SUBJECT -->

<div class="card">

    <h2>Subject</h2>

    <select id="subjectSelect"></select>

</div>


<!-- TASK -->

<div class="card">

    <div class="task">

        <div>

            <h2>Complete a study task</h2>

            <p>
                Complete one task in your selected subject.
            </p>

        </div>

        <button onclick="completeTask()">
            Complete Task (+25 XP)
        </button>

    </div>

</div>


<!-- RESET -->

<div class="card">

    <h2>Reset Progress</h2>

    <p class="small">
        This permanently resets all XP and levels.
        Type the exact phrase to reset:
        'BAGUETTES ARE HOLY'.
    </p>

    <input
        id="resetPhrase"
        placeholder="Type the reset phrase"
    >

    <div class="reset">

        <button
            onclick="resetProgress()"
            id="resetButton"
            disabled
        >
            Reset Progress
        </button>

    </div>

</div>

</div>


<script>

/* SUBJECTS */

const subjects = [
    "Art",
    "Biology",
    "Chemistry",
    "Computer Science",
    "English Language",
    "English Literature",
    "French",
    "Geography",
    "History",
    "Mathematics",
    "Religious Studies",
    "Physics"
];

const TASK_XP = 25;

const RESET_PHRASE = "BAGUETTES ARE HOLY";


/* SUBJECT COLOURS */

const subjectColours = {
    "Art": "#e53935",
    "Biology": "#40e0d0",
    "Chemistry": "#ffd600",
    "Computer Science": "#87ceeb",
    "English Language": "#00008b",
    "English Literature": "#8b4513",
    "French": "#ff69b4",
    "Geography": "#006400",
    "History": "#ff8c00",
    "Mathematics": "#d4af37",
    "Religious Studies": "#c0c0c0",
    "Physics": "#228b22"
};


/* LEVEL XP */

function xpForLevel(level) {
    return 100 + (level - 1) * 5;
}


/* GET CURRENT LEVEL */

function getLevel(totalXp) {

    let level = 1;
    let remaining = totalXp;

    while (remaining >= xpForLevel(level)) {
        remaining -= xpForLevel(level);
        level++;
    }

    return {
        level: level,
        current: remaining,
        needed: xpForLevel(level)
    };
}


/* LOAD DATA */

let data;

try {
    data = JSON.parse(
        localStorage.getItem("studyLevelUp")
    );
} catch (error) {
    data = null;
}


/* CREATE DATA IF NECESSARY */

if (
    !data ||
    typeof data.totalXp !== "number"
) {

    data = {
        totalXp: 0,
        subjects: {},
        history: []
    };
}


/* MAKE SURE SUBJECT DATA EXISTS */

if (!data.subjects) {
    data.subjects = {};
}

subjects.forEach(subject => {

    if (typeof data.subjects[subject] !== "number") {
        data.subjects[subject] = 0;
    }

});


/*
IMPORTANT:

If the old version of the app was used,
there may be no task history.

New tasks will be recorded from now on.
*/

if (!Array.isArray(data.history)) {
    data.history = [];
}


/* SAVE */

function save() {

    localStorage.setItem(
        "studyLevelUp",
        JSON.stringify(data)
    );

}


/* COMPLETE TASK */

function completeTask() {

    const subject =
        document.getElementById("subjectSelect").value;


    /* Add XP */

    data.totalXp += TASK_XP;

    data.subjects[subject] += TASK_XP;


    /*
    Record this exact task.

    This is what allows every 25 XP
    section to keep its own colour.
    */

    data.history.push({
        subject: subject,
        xp: TASK_XP
    });


    save();

    render();

}


/* RESET */

function resetProgress() {

    if (
        document.getElementById("resetPhrase").value
        === RESET_PHRASE
    ) {

        data = {
            totalXp: 0,
            subjects: {},
            history: []
        };


        subjects.forEach(subject => {
            data.subjects[subject] = 0;
        });


        save();


        document.getElementById(
            "resetPhrase"
        ).value = "";


        document.getElementById(
            "resetButton"
        ).disabled = true;


        render();

    }

}


/*
DRAW THE PROGRESS BAR

Each task gets its own segment.

For example:

Physics +25
Physics +25
French +25
Art +25

becomes:

GREEN | GREEN | PINK | RED
*/

function renderProgressBar() {

    const bar =
        document.getElementById("mainBar");


    /* Clear the current bar */

    bar.innerHTML = "";


    const overall =
        getLevel(data.totalXp);


    /*
    Calculate how much XP belongs
    to previous levels.
    */

    let previousLevelsXp = 0;

    for (
        let level = 1;
        level < overall.level;
        level++
    ) {

        previousLevelsXp +=
            xpForLevel(level);

    }


    /*
    Track where we are in the
    complete task history.
    */

    let totalPosition = 0;


    data.history.forEach(task => {

        const taskStart = totalPosition;

        const taskEnd =
            totalPosition + task.xp;

        totalPosition = taskEnd;


        /*
        Ignore tasks belonging entirely
        to previous levels.
        */

        if (taskEnd <= previousLevelsXp) {
            return;
        }


        /*
        Find the part of this task
        that belongs to the current level.
        */

        const visibleStart =
            Math.max(
                taskStart,
                previousLevelsXp
            );


        const visibleEnd =
            Math.min(
                taskEnd,
                previousLevelsXp + overall.needed
            );


        const visibleXp =
            visibleEnd - visibleStart;


        if (visibleXp <= 0) {
            return;
        }


        /* CREATE COLOURED SEGMENT */

        const segment =
            document.createElement("div");


        segment.className =
            "xp-segment";


        segment.style.width =
            (
                visibleXp /
                overall.needed *
                100
            ) + "%";


        segment.style.backgroundColor =
            subjectColours[task.subject] ||
            "#171717";


        bar.appendChild(segment);

    });

}


/* RENDER */

function render() {

    const overall =
        getLevel(data.totalXp);


    document.getElementById(
        "level"
    ).textContent =
        "Level " + overall.level;


    document.getElementById(
        "xpText"
    ).textContent =
        overall.current +
        " / " +
        overall.needed +
        " XP";


    document.getElementById(
        "totalXp"
    ).textContent =
        "Total XP: " +
        data.totalXp;


    renderProgressBar();

}


/* SUBJECT DROPDOWN */

const select =
    document.getElementById(
        "subjectSelect"
    );


subjects.forEach(subject => {

    const option =
        document.createElement("option");

    option.value = subject;

    option.textContent = subject;

    select.appendChild(option);

});


/* RESET BUTTON */

document
    .getElementById("resetPhrase")
    .addEventListener(
        "input",
        function() {

            document.getElementById(
                "resetButton"
            ).disabled =
                this.value !== RESET_PHRASE;

        }
    );


/* START */

render();

</script>

</body>
</html>
